<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AETHER Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#03060C; --bg:#050A14; --panel:rgba(9,16,29,.80); --panel-solid:#09101D; --panel-2:#0D1626;
  --line:#16233A; --line-2:#22354F; --line-3:#33507A;
  --text:#E3EBF5; --text-2:#9DADC2; --text-3:#6A7D98;
  --cyan:#5FD0E4; --cyan-dim:rgba(95,208,228,.12); --blue:#4C8DFF; --blue-dim:rgba(76,141,255,.13);
  --amber:#EFA43E; --amber-dim:rgba(239,164,62,.12); --red:#FF5B55; --red-dim:rgba(255,91,85,.13);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sbw:220px; --top:56px; --status:32px; --r:3px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]), :root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--void)}
body{height:100%;margin:0;overflow:hidden;color:var(--text);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 700px at 78% -10%,rgba(40,80,150,.14),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(30,90,120,.10),transparent 60%),var(--void)}
#root{height:100%}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p{margin:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.label{font:500 11px/1.3 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.muted{color:var(--text-2)}
.unit{font:400 12px var(--sans);color:var(--text-3);margin-left:6px;letter-spacing:.02em}
.meta{font-size:11px;color:var(--text-3)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:2px}
h1:focus,main:focus{outline:none}
.ok{--c:var(--cyan)} .warn{--c:var(--amber)} .crit{--c:var(--red)} .idle{--c:var(--text-3)} .info{--c:var(--blue)}
.icon{flex:none;display:block}
.rot90{transform:rotate(90deg)}
.hide-sm{} .hide-md{}

/* starfield */
.starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* status atoms */
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--cyan));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--cyan)) 16%,transparent);flex:none;display:inline-block}
.dot.pulse{animation:dotp 2.4s ease-in-out infinite}
@keyframes dotp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 0%,transparent)}}
.pill{display:inline-flex;align-items:center;gap:8px;height:22px;padding:0 9px 0 8px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent);color:var(--c);border-radius:2px;font:500 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.pill .dot{width:6px;height:6px;box-shadow:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line-2);background:rgba(255,255,255,.015);color:var(--text-2);border-radius:2px;cursor:pointer;font-size:13px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s,transform .1s}
.btn:hover:not(:disabled){color:var(--text);border-color:var(--line-3);background:rgba(255,255,255,.04)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{width:32px;padding:0}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.icon.sm{width:28px;padding:0}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.05)}
.btn.primary{border-color:rgba(95,208,228,.45);background:rgba(95,208,228,.1);color:var(--cyan)}
.btn.primary:hover:not(:disabled){background:rgba(95,208,228,.18);color:#BFF1FA;border-color:rgba(95,208,228,.7)}
.btn.wide{width:100%}
.btn.toggle[aria-pressed="true"]{color:var(--cyan);border-color:rgba(95,208,228,.4);background:var(--cyan-dim)}
.linklike{background:none;border:0;padding:0;color:var(--cyan);cursor:pointer;text-align:left;font-size:inherit}
.linklike:hover{text-decoration:underline}
kbd{font:500 10px var(--mono);padding:2px 5px;border:1px solid var(--line-2);border-radius:2px;color:var(--text-3);background:rgba(255,255,255,.02)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;padding:2px;gap:2px;background:rgba(0,0,0,.2)}
.seg button{height:28px;padding:0 11px;border:0;background:transparent;color:var(--text-3);border-radius:1px;cursor:pointer;font-size:12.5px;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--cyan-dim);color:var(--cyan)}
.seg-sm button{height:24px;padding:0 9px;font-size:12px}
.seg-scroll{overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg-scroll::-webkit-scrollbar{display:none}

/* panels */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.instrument::before{content:"";position:absolute;inset:-1px;pointer-events:none;z-index:2;
  --t:rgba(95,208,228,.55);
  background:
   linear-gradient(var(--t),var(--t)) top left/12px 1px no-repeat, linear-gradient(var(--t),var(--t)) top left/1px 12px no-repeat,
   linear-gradient(var(--t),var(--t)) top right/12px 1px no-repeat, linear-gradient(var(--t),var(--t)) top right/1px 12px no-repeat,
   linear-gradient(var(--t),var(--t)) bottom left/12px 1px no-repeat, linear-gradient(var(--t),var(--t)) bottom left/1px 12px no-repeat,
   linear-gradient(var(--t),var(--t)) bottom right/12px 1px no-repeat, linear-gradient(var(--t),var(--t)) bottom right/1px 12px no-repeat}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:8px 16px;border-bottom:1px solid var(--line)}
.panel-head h2.label{color:var(--text-2)}
.panel-aside{display:flex;align-items:center;gap:8px}
.panel-body{padding:16px}
.panel-body.flush{padding:0}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr) var(--status);height:100%;transition:grid-template-columns .32s var(--ease)}
.shell.collapsed{--sbw:64px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--panel-2);border:1px solid var(--cyan);padding:8px 12px;color:var(--text);text-decoration:none}
.skip:focus{top:10px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px 0 14px;border-bottom:1px solid var(--line);background:rgba(3,7,14,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{fill:none;stroke:var(--cyan);stroke-width:1.4}
.brand-mark circle{fill:rgba(95,208,228,.15)}
.brand-mark .bm-dot{fill:var(--cyan);stroke:none}
.brand-word{font:500 15px var(--sans);letter-spacing:.42em;color:var(--text);padding-right:2px}
.brand-sub{font-size:12px;color:var(--text-3);padding-left:12px;border-left:1px solid var(--line-2);white-space:nowrap}
.tb-mission{display:flex;align-items:center;gap:12px;margin-left:18px;padding-left:18px;border-left:1px solid var(--line);font-size:13px;color:var(--text-2);white-space:nowrap}
.tb-mission .num{color:var(--text)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.cmdk{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px 0 10px;border:1px solid var(--line-2);background:rgba(255,255,255,.02);border-radius:2px;color:var(--text-3);cursor:pointer;font-size:13px;min-width:210px;transition:border-color .2s,color .2s}
.cmdk:hover{border-color:var(--line-3);color:var(--text-2)}
.cmdk kbd{margin-left:auto}
.bell{position:relative}
.badge{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--amber);color:#1B1003;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;line-height:1}
.tb-clocks{display:flex;gap:18px;padding-left:14px;border-left:1px solid var(--line)}
.tb-clocks>div{display:flex;flex-direction:column;line-height:1.15}
.tb-clocks .label{font-size:9.5px}
.tb-clocks .num{font-size:13.5px;color:var(--text)}

.sidebar{grid-row:2;display:flex;flex-direction:column;justify-content:space-between;padding:14px 10px;border-right:1px solid var(--line);background:rgba(3,7,14,.55);overflow:hidden;min-width:0}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:13px;height:40px;padding:0 12px;border-radius:2px;color:var(--text-2);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.nav-item:hover{background:rgba(255,255,255,.035);color:var(--text)}
.nav-item.active{color:var(--text);background:linear-gradient(90deg,rgba(95,208,228,.1),rgba(95,208,228,0))}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:2px;background:var(--cyan)}
.nav-item.active .icon{color:var(--cyan)}
.nav-label{transition:opacity .2s}
.nav-flag{width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:auto}
.collapsed .nav-label,.collapsed .sb-event{opacity:0;pointer-events:none}
.collapsed .nav-flag{position:absolute;left:30px;top:10px}
.sb-foot{display:flex;flex-direction:column;gap:10px}
.sb-event{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:2px;background:rgba(0,0,0,.2);white-space:nowrap;transition:opacity .2s}
.sb-ev-name{font-size:13px;color:var(--text-2)}
.sb-ev-t{font-size:17px;color:var(--text)}
.sb-collapse{justify-content:flex-start;gap:13px;padding:0 12px;height:36px;color:var(--text-3)}

.main{grid-row:2;grid-column:2;overflow-y:auto;overflow-x:hidden;min-width:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.page-wrap{animation:pageIn .38s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}}
.page{max-width:1560px;margin:0 auto;padding:26px 28px 44px;display:flex;flex-direction:column;gap:16px}
.statusbar{grid-column:1/-1;display:flex;align-items:center;gap:0;border-top:1px solid var(--line);background:rgba(3,7,14,.88);font-size:12px;color:var(--text-2);overflow:hidden;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:8px;padding:0 16px;height:100%;border-right:1px solid var(--line)}
.sb-item .label{font-size:10px}
.sb-item .num{color:var(--text)}
.sb-item .u{color:var(--text-3);font-size:11px;margin-left:-4px}
.sb-item .dot{width:6px;height:6px}
.warn-t{color:var(--amber);font-size:11px}
.sb-end{margin-left:auto;border-right:0;border-left:1px solid var(--line)}
.bottomnav{display:none}

/* page header */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:4px}
.phead h1,.mission-head h1{font:300 30px/1.1 var(--sans);letter-spacing:-.01em}
.phead p{margin-top:8px;max-width:66ch;color:var(--text-2)}
.phead-aside{display:flex;align-items:center;gap:12px}
.live{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-2)}
.inline-stats{display:flex;gap:26px;margin:0}
.inline-stats div{display:flex;flex-direction:column}
.inline-stats dt{font:500 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.inline-stats dd{margin:0;font-size:22px}

.mission-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:4px}
.mh-name{margin-top:6px;color:var(--text-2);font-size:15px}
.mh-name .num{color:var(--cyan);margin-right:8px}
.mh-facts{display:flex;gap:0;margin:0;flex-wrap:wrap}
.mh-facts>div{padding:0 20px;border-left:1px solid var(--line)}
.mh-facts dt{font:500 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
.mh-facts dd{margin:0;font-size:15px;color:var(--text)}

/* grid */
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}

/* telemetry cards */
.tstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:13px 15px 11px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);cursor:pointer;min-width:0;transition:border-color .25s,background .25s}
.tcard:hover{border-color:var(--line-3)}
.tcard[aria-pressed="true"]{border-color:rgba(95,208,228,.5);background:linear-gradient(180deg,rgba(95,208,228,.07),rgba(95,208,228,0) 70%),var(--panel)}
.tcard.warn[aria-pressed="true"]{border-color:rgba(239,164,62,.55)}
.tc-top{display:flex;align-items:center;justify-content:space-between}
.tc-val{display:flex;align-items:baseline;margin-top:4px}
.tc-val .num{font-size:25px;font-weight:400;color:var(--text);line-height:1.1}
.tc-sub{font-size:11.5px;color:var(--text-3)}
.tc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.tc-trend{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:72px;height:22px;flex:none;overflow:visible}
.spark path{fill:none;stroke:var(--cyan);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.8}
.tcard.warn .spark path{stroke:var(--amber)}

/* chart */
.chart-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:10px;flex-wrap:wrap}
.chart-now{display:flex;flex-direction:column;align-items:flex-end}
.chart-now-val{font-size:26px;display:flex;align-items:baseline}
.chart-wrap{position:relative;width:100%;min-width:0}
.chart{display:block;touch-action:pan-y;cursor:crosshair}
.grid-line{stroke:var(--line);stroke-width:1}
.grid-line.v{stroke-dasharray:2 4}
.axis-text{fill:var(--text-3);font:11px var(--mono)}
.chart-line{fill:none;stroke:var(--cyan);stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .9s var(--ease)}
@keyframes draw{from{stroke-dashoffset:1}}
.chart-area{animation:fadeIn .9s ease}
@keyframes fadeIn{from{opacity:0}}
.chart-head{fill:var(--cyan)}
.chart-head-ring{fill:none;stroke:var(--cyan);transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(3.4);opacity:0}}
.limit line{stroke:var(--amber);stroke-dasharray:4 4;opacity:.7}
.limit text{fill:var(--amber);font:11px var(--sans);opacity:.85}
.chart-cursor line{stroke:var(--text-3);stroke-dasharray:3 3}
.chart-cursor circle{fill:var(--void);stroke:var(--text);stroke-width:1.5}
.chart-tip{position:absolute;pointer-events:none;display:flex;flex-direction:column;padding:7px 10px;background:rgba(6,11,21,.95);border:1px solid var(--line-3);border-radius:2px;white-space:nowrap;z-index:3}
.tip-v{font-size:14px;color:var(--text)}
.tip-t{font-size:11px;color:var(--text-3)}

/* orbital map */
.map-panel .panel-body{overflow:hidden}
.omap{position:relative;aspect-ratio:960/520;width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,rgba(20,40,75,.25),transparent 70%)}
.omap::after{content:"";position:absolute;left:0;right:0;height:1px;top:0;background:linear-gradient(90deg,transparent,rgba(95,208,228,.14),transparent);animation:scan 9s linear infinite;pointer-events:none}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(60vw)}}
.omap-svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.omap-svg:active{cursor:grabbing}
.omap-svg:focus-visible{outline-offset:-3px}
.og-grid circle,.og-grid line{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 5}
.og-ring-label{fill:var(--text-3);font:10.5px var(--mono)}
.moon-orbit{fill:none;stroke:rgba(157,173,194,.22);stroke-width:1;stroke-dasharray:1 5}
.return-leg{fill:none;stroke:rgba(76,141,255,.2);stroke-width:1;stroke-dasharray:3 6}
.target-orbit{fill:none;stroke:rgba(95,208,228,.55);stroke-width:1.3;stroke-dasharray:6 5}
.traj-planned{fill:none;stroke:rgba(95,208,228,.6);stroke-width:1.4;stroke-dasharray:5 5}
.traj-flown{fill:none;stroke:var(--cyan);stroke-width:1.8}
.atmo{fill:none;stroke:rgba(95,208,228,.4);stroke-width:1}
.craters circle{fill:rgba(40,45,55,.35);stroke:rgba(255,255,255,.06)}
.body-label{fill:var(--text-2);font:500 11px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.map-mark path{fill:none;stroke:var(--text-2);stroke-width:1.2}
.map-mark text{fill:var(--text-2);font:11px var(--mono)}
.preview circle{fill:var(--cyan);opacity:.9}
.preview text{fill:var(--text-3);font:10.5px var(--sans)}
.heading line{stroke:var(--text);stroke-width:1.3}
.heading path{fill:var(--text)}
.craft-hit{cursor:pointer;outline:none}
.craft-hit .hit{fill:transparent}
.craft-mark{fill:var(--void);stroke:#fff;stroke-width:1.8;transition:fill .2s}
.craft-hit.hov .craft-mark,.craft-hit.sel .craft-mark{fill:var(--cyan)}
.craft-hit:focus-visible .hit{stroke:var(--cyan);stroke-width:1.5}
.craft-pulse{fill:none;stroke:#fff;transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
.brackets path{fill:none;stroke:var(--cyan);stroke-width:1.5}
.craft-label{fill:var(--text);font:500 12px var(--mono);letter-spacing:.04em}
.scalebar path{fill:none;stroke:var(--text-2);stroke-width:1}
.scalebar text{fill:var(--text-2);font:10.5px var(--mono)}
.omap-tools{position:absolute;top:10px;right:10px;display:flex;gap:2px;padding:3px;background:rgba(4,8,16,.78);border:1px solid var(--line);border-radius:2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.omap-tools .btn{border-color:transparent;background:transparent;height:30px;width:30px}
.omap-tools .btn:hover{background:rgba(255,255,255,.06)}
.omap-tools .btn.toggle[aria-pressed="true"]{background:var(--cyan-dim)}
.tool-sep{width:1px;background:var(--line-2);margin:4px 3px}
.omap-tip{position:absolute;display:flex;flex-direction:column;gap:2px;padding:9px 11px;background:rgba(5,10,20,.94);border:1px solid var(--line-3);border-radius:2px;font-size:12px;color:var(--text-2);pointer-events:none;white-space:nowrap;z-index:3}
.omap-tip strong{font:500 12px var(--mono);color:var(--text);margin-bottom:3px}
.omap-tip b{font-weight:400;color:var(--text);margin-left:6px}
.omap-tip em{font-style:normal;color:var(--cyan);font-size:11px;margin-top:3px}
.omap-card{position:absolute;top:10px;left:10px;width:min(290px,calc(100% - 20px));padding:12px 14px 14px;background:rgba(5,10,20,.94);border:1px solid rgba(95,208,228,.35);border-radius:2px;animation:cardIn .25s var(--ease);z-index:3}
@keyframes cardIn{from{opacity:0;transform:translateY(-4px)}}
.oc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.oc-head strong{display:block;font:500 16px var(--mono);margin-top:2px}
.omap-card dl{margin:0 0 12px}
.omap-card dl div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.omap-card dt{color:var(--text-3)} .omap-card dd{margin:0;color:var(--text)}
.omap-legend{position:absolute;left:12px;bottom:10px;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-3);pointer-events:none}
.omap-legend span{display:flex;align-items:center;gap:6px}
.omap-legend i{display:inline-block;width:18px;height:0;border-top:1.8px solid var(--cyan)}
.omap-legend .lg-planned{border-top:1.4px dashed rgba(95,208,228,.7)}
.omap-legend .lg-target{border-top:1.4px dashed rgba(95,208,228,.55)}
.omap-legend .lg-moon{border-top:1px dotted rgba(157,173,194,.55)}
.lg-note{opacity:.8}
.omap-readout{position:absolute;right:12px;top:52px;font-size:10.5px;color:var(--text-3);pointer-events:none;text-align:right}
.omap-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 12px;background:rgba(5,10,20,.9);border:1px solid var(--line-2);border-radius:2px;font-size:12.5px;color:var(--text-2);opacity:0;transition:opacity .25s;pointer-events:none}
.omap-hint.on{opacity:1}

/* situation */
.situation{height:100%}
.sit-body{display:flex;flex-direction:column;padding:0}
.sit-block{padding:15px 16px;border-bottom:1px solid var(--line)}
.sit-block:last-child{border-bottom:0}
.sit-q{font:500 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.sit-big{display:flex;align-items:baseline;flex-wrap:wrap}
.sit-big .num{font-size:30px;line-height:1.1;color:var(--text)}
.sit-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text-3);margin-top:6px}
.sit-row .num{color:var(--text-2)}
.sit-phase{font-size:16px;color:var(--text)}
.sit-count{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}
.sit-count .count{font-size:22px;color:var(--cyan)}
.sit-verdict{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--text)}
.sit-verdict.warn{color:var(--text)}
.sys-chips{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.sys-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 9px;border:1px solid var(--line-2);background:transparent;border-radius:2px;color:var(--text-2);font-size:12px;cursor:pointer;transition:border-color .2s,color .2s}
.sys-chip:hover{color:var(--text);border-color:var(--line-3)}
.sys-chip .dot{width:6px;height:6px;box-shadow:none}
.sys-chip.warn{border-color:rgba(239,164,62,.45);color:var(--amber)}

/* radar */
.radar{display:flex;flex-direction:column;align-items:center;gap:12px}
.radar-svg{width:100%;max-width:300px;height:auto;overflow:visible}
.r-ring{fill:none;stroke:var(--line-2)}
.r-ring:last-of-type{stroke:var(--line-3)}
.r-tick{stroke:var(--line-3)}
.r-cross{stroke:var(--line);stroke-dasharray:2 4}
.r-deg{fill:var(--text-3);font:10px var(--mono)}
.r-rlabel{fill:var(--text-3);font:9px var(--mono)}
.r-sweep{transform-origin:0 0;animation:spin linear infinite}
.r-sweep path{fill:var(--cyan)}
.r-sweep.still{animation:none;opacity:.5}
.r-lead{stroke:var(--cyan);stroke-width:1.3}
@keyframes spin{to{transform:rotate(360deg)}}
.r-blip{opacity:.3;animation:blip linear infinite}
.r-blip.still{animation:none;opacity:1}
@keyframes blip{0%{opacity:1}65%{opacity:.3}100%{opacity:.3}}
.r-obj circle,.r-obj rect{fill:var(--text)}
.r-obj.body circle{fill:#C9CFD8}
.r-obj.debris rect{fill:var(--amber)}
.r-obj text{fill:var(--text-3);font:10px var(--sans)}
.r-self{fill:var(--cyan)}
.radar-table{width:100%;border-collapse:collapse;font-size:12px}
.radar-table th{text-align:left;font:500 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:4px 0;border-bottom:1px solid var(--line)}
.radar-table td{padding:5px 0;border-bottom:1px solid var(--line);color:var(--text-2)}
.radar-table th:not(:first-child),.radar-table td:not(:first-child){text-align:right}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:83px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl-item{display:grid;grid-template-columns:70px 28px minmax(0,1fr);align-items:start;padding:9px 0}
.tl-item time{font-size:12px;color:var(--text-3);padding-top:1px}
.tl-node{width:9px;height:9px;margin:5px 0 0 9px;border:1.5px solid var(--cc,var(--text-3));background:var(--void);border-radius:50%;position:relative;z-index:1}
.tl-title{color:var(--text);font-size:14px}
.tl-body p{color:var(--text-2);font-size:13px;margin-top:3px;max-width:72ch}
.tl-cat{display:inline-block;margin-top:6px;font:500 10px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--cc,var(--text-3))}
.timeline.compact .tl-item{padding:7px 0}
.timeline.compact .tl-title{font-size:13.5px}
.cat-navigation{--cc:var(--cyan)} .cat-telemetry{--cc:var(--blue)} .cat-communication{--cc:#8FB4E8} .cat-system{--cc:var(--text-2)} .cat-alert{--cc:var(--amber)}
.empty{color:var(--text-3);padding:18px 0;font-size:13px;list-style:none}

/* mini msgs */
.mini-msgs{list-style:none;margin:0;padding:0}
.mini-msgs li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.mini-msgs li:last-child{border-bottom:0}
.mm-t{font-size:11.5px;color:var(--text-3)}
.mm-src{font:500 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--sc)}
.mm-text{grid-column:1/-1;font-size:13px;color:var(--text-2)}
.src-control{--sc:var(--cyan)} .src-craft{--sc:var(--text)} .src-ground{--sc:var(--blue)} .src-auto{--sc:#9AA9BE} .src-all{--sc:var(--text-2)}

/* orbit page */
.phase-now{font:300 24px/1.2 var(--sans);color:var(--text);margin-bottom:6px}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.progress-head .num{font-size:18px;color:var(--text)}
.seg-bar{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;height:12px}
.seg-bar i{background:var(--line);border-radius:1px}
.seg-bar i.on{background:var(--cyan)}
.kv{margin:0}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;color:var(--text);text-align:right}
.phases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0}
.ph{display:flex;flex-direction:column;gap:4px;padding:4px 14px 4px 14px;border-left:1px solid var(--line);position:relative}
.ph::before{content:"";position:absolute;left:-1px;top:0;width:1px;height:100%}
.ph.done::before{background:rgba(95,208,228,.45)}
.ph.current::before{background:var(--cyan);width:2px}
.ph-n{font-size:11px;color:var(--text-3)}
.ph-name{font-size:14px;color:var(--text-2)}
.ph.current .ph-name{color:var(--text)}
.ph.next .ph-name{color:var(--text-3)}
.ph-when{font-size:11.5px;color:var(--text-3)}
.ph.current .ph-when{color:var(--cyan)}

/* spacecraft */
.craft-body{display:flex;align-items:center}
.craft-svg{display:block;width:100%;height:auto}
.craft-ref line,.craft-ref path{stroke:var(--line-2);stroke-dasharray:3 5;fill:none}
.craft-ref text{fill:var(--text-3);font:10.5px var(--mono)}
.part{cursor:pointer;outline:none}
.part .shape{stroke:#3A5579;stroke-width:1.3;fill-opacity:1;transition:stroke .2s,filter .2s}
.part .shape:not([fill]){fill:#12203A}
.part .inner{fill:none;stroke:#2C4264;stroke-dasharray:3 3}
.part .strut{stroke:#3A5579;stroke-width:2}
.part:hover .shape,.part:focus-visible .shape{stroke:#8CB3DE}
.part.sel .shape,.part.sel .strut{stroke:var(--cyan)}
.part.sel .shape{filter:drop-shadow(0 0 6px rgba(95,208,228,.35))}
.part.st-warn .shape{stroke:rgba(239,164,62,.8)}
.part.st-warn.sel .shape{stroke:var(--amber);filter:drop-shadow(0 0 6px rgba(239,164,62,.35))}
.part-label circle{fill:var(--text-3)}
.part-label polyline{fill:none;stroke:var(--line-3);stroke-width:1}
.part-label text{fill:var(--text-2);font:500 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.part-label .part-state{fill:var(--amber);font-size:10.5px}
.part.sel .part-label text{fill:var(--cyan)}
.part.sel .part-label circle{fill:var(--cyan)}
.part.sel .part-label polyline{stroke:var(--cyan)}
.part:focus-visible .part-label text{text-decoration:underline}
.plume{animation:plume 1.4s ease-in-out infinite alternate}
@keyframes plume{from{opacity:.55}to{opacity:1}}
.sub-detail{display:flex;flex-direction:column;gap:14px}
.sd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sd-head h2{font:300 26px/1.15 var(--sans);margin-top:3px}
.sd-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.sd-stats>div{background:var(--panel-solid);padding:11px 12px;display:flex;flex-direction:column;gap:3px}
.sd-v{display:flex;align-items:baseline}
.sd-v .num{font-size:21px;color:var(--text)}
.sd-v.small{font-size:14px;color:var(--text);padding-top:5px}
.bar{display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px;flex:1}
.bar i{display:block;height:100%;background:var(--c,var(--cyan));transition:width .6s var(--ease)}
.spinner{width:13px;height:13px;border:1.5px solid rgba(95,208,228,.3);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}
.indet{height:2px;background:var(--line);overflow:hidden;margin-top:-8px}
.indet i{display:block;height:100%;width:30%;background:var(--cyan);animation:indet 1.1s ease-in-out infinite}
@keyframes indet{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.table-scroll{overflow-x:auto;max-width:100%}
.table{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
.table th,.table td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.table thead th{font:500 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.table tbody th{font-weight:400;color:var(--text)}
.table td{color:var(--text-2)}
.table tbody tr{transition:background .2s}
.table tbody tr:hover{background:rgba(255,255,255,.02)}
.table tr.current{background:rgba(95,208,228,.05)}
.table tbody tr:last-child th,.table tbody tr:last-child td{border-bottom:0}
.table .right{text-align:right}
.cell-bar{display:flex;align-items:center;gap:10px;min-width:150px}
.cell-bar .bar{margin-top:0;max-width:90px}

/* crew */
.crew-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
.crew-card{padding:18px;display:flex;flex-direction:column;gap:14px;transition:border-color .25s}
.crew-card.open{border-color:var(--line-3)}
.cc-top{display:flex;gap:14px;align-items:center}
.avatar{flex:none}
.avatar text{fill:#EAF6FF;font:500 15px var(--sans);letter-spacing:.04em}
.av-ring{fill:none;stroke:rgba(95,208,228,.45);stroke-width:1}
.cc-id{display:flex;flex-direction:column;min-width:0}
.cc-id h2{font:400 19px/1.25 var(--sans);color:var(--text)}
.cc-id .muted{font-size:12.5px}
.cc-row{display:flex;justify-content:space-between;align-items:center}
.cc-hr{font-size:12px;color:var(--text-3)}
.cc-hr .num{font-size:15px;color:var(--text)}
.cc-task{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);background:rgba(0,0,0,.18);border-radius:2px}
.cc-task span:last-child{color:var(--text)}
.cc-toggle{align-self:flex-start}
.cc-toggle .icon{transition:transform .25s}
.cc-more{display:flex;flex-direction:column;gap:12px;animation:cardIn .3s var(--ease)}
.cc-more[hidden]{display:none}
.cc-tasks{list-style:none;margin:0;padding:0}
.cc-tasks li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--text-2)}
.t-state{width:38px;flex:none;font:500 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.t-now .t-state{color:var(--cyan)} .t-now{color:var(--text)!important}
.t-done{color:var(--text-3)!important}
.cc-vitals .spark{width:100%;height:30px;margin-top:4px}

/* comms */
.comms-grid{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;gap:16px;align-items:start}
.ch-list ul{list-style:none;margin:0;padding:8px}
.ch{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:0;background:transparent;color:var(--text-2);border-radius:2px;cursor:pointer;font-size:13px;text-align:left;transition:background .2s,color .2s}
.ch:hover{background:rgba(255,255,255,.035);color:var(--text)}
.ch[aria-pressed="true"]{background:rgba(95,208,228,.08);color:var(--text)}
.ch-mark{width:8px;height:8px;border-radius:1px;background:var(--sc)}
.ch-n{margin-left:auto;font-size:11px;color:var(--text-3)}
.console{display:flex;flex-direction:column;height:min(640px,calc(100dvh - 250px));min-height:420px}
.stream{flex:1;overflow-y:auto;padding:12px 18px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;background:linear-gradient(rgba(95,208,228,.012) 1px,transparent 1px) 0 0/100% 4px}
.msg{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;padding:9px 0;border-bottom:1px dashed var(--line);animation:msgIn .3s var(--ease)}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}}
.msg-t{font-size:12px;color:var(--text-3)}
.msg-src{font:500 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--sc);align-self:center}
.msg-text{grid-column:2;font:400 14px/1.5 var(--mono);color:var(--text);letter-spacing:-.005em}
.msg.src-auto .msg-text{color:var(--text-2)}
.msg-status{grid-column:2;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);margin-top:2px}
.msg-status.delivered{color:var(--cyan)}
.dots{display:inline-flex;gap:3px;margin-left:2px}
.dots i{width:3px;height:3px;border-radius:50%;background:currentColor;animation:dots 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dots{50%{opacity:.2}}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.compose-row{display:flex;gap:8px;align-items:center;position:relative}
.compose-row input,.search-box input,.note-form textarea{flex:1;min-width:0;height:38px;padding:0 60px 0 12px;background:rgba(0,0,0,.3);border:1px solid var(--line-2);border-radius:2px;color:var(--text);font-family:var(--mono);font-size:13.5px;transition:border-color .2s}
.compose-row input:focus,.search-box input:focus,.note-form textarea:focus{outline:none;border-color:rgba(95,208,228,.6)}
.compose-row .btn{height:38px}
.char-n{position:absolute;right:122px;font-size:10.5px;color:var(--text-3);pointer-events:none}
.link-panel .panel-body{display:flex;flex-direction:column;gap:14px}
.sig{display:flex;align-items:flex-end;gap:14px}
.sig-bars{display:flex;align-items:flex-end;gap:3px;height:28px}
.sig-bars i{width:5px;background:var(--line-2);border-radius:1px}
.sig-bars i.on{background:var(--cyan)}
.sig-v{display:flex;align-items:baseline}
.sig-v .num{font-size:24px}
.wave{width:100%;height:40px;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.wave path{fill:none;stroke:var(--cyan);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7}
.wave-move{animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(-137.4px)}}

/* logs */
.log-tools{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.search-box{position:relative;display:flex;align-items:center;min-width:240px}
.search-box .icon{position:absolute;left:11px;color:var(--text-3)}
.search-box input{padding:0 12px 0 34px;font-family:var(--sans)}
.note-form{display:flex;flex-direction:column;gap:10px}
.note-form textarea{height:auto;padding:10px 12px;resize:vertical;font-family:var(--sans)}
.cat-bars{list-style:none;margin:0;padding:0}
.cat-row{display:grid;grid-template-columns:10px 110px 1fr 28px;align-items:center;gap:10px;width:100%;padding:8px 6px;border:0;background:transparent;color:var(--text-2);cursor:pointer;font-size:13px;text-align:left;border-radius:2px}
.cat-row:hover{background:rgba(255,255,255,.03);color:var(--text)}
.cat-row[aria-pressed="true"]{background:rgba(95,208,228,.06);color:var(--text)}
.cat-row .bar{margin:0}
.cat-row .bar i{background:var(--cc)}
.cat-row .num{text-align:right;color:var(--text-3)}
.cat-sw{width:8px;height:8px;border-radius:50%;background:var(--cc)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(1,3,8,.62);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:40;animation:fadeIn .2s ease}
.drawer-wrap{position:fixed;inset:0;z-index:40;pointer-events:none}
.drawer-wrap .scrim{opacity:0;transition:opacity .3s;animation:none}
.drawer-wrap.open{pointer-events:auto}
.drawer-wrap.open .scrim{opacity:1}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:#070D19;border-left:1px solid var(--line-2);z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .34s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-wrap.open .drawer{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.drawer-head h2{font:300 22px var(--sans)}
.drawer-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 18px 14px;border-bottom:1px solid var(--line)}
.alert-list{list-style:none;margin:0;padding:6px 0;overflow-y:auto;flex:1}
.alert{position:relative;display:grid;grid-template-columns:20px 1fr;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);animation:msgIn .3s var(--ease)}
.alert .al-icon,.toast .al-icon{color:var(--c);margin-top:2px}
.alert.read{opacity:.62}
.al-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--text-3)}
.al-level{font:500 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--c)}
.alert h3{font:500 14px/1.35 var(--sans);margin:4px 0 3px}
.alert p{font-size:13px;color:var(--text-2)}
.al-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.unread-dot{position:absolute;right:16px;top:44px;width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.alert.crit{background:linear-gradient(90deg,var(--red-dim),transparent 40%)}
.toasts{position:fixed;right:18px;bottom:calc(var(--status) + 16px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 36px))}
.toast{display:grid;grid-template-columns:18px 1fr auto;gap:12px;padding:12px 10px 12px 14px;background:rgba(7,13,25,.97);border:1px solid var(--line-2);border-left:2px solid var(--c);border-radius:2px;animation:toastIn .35s var(--ease);box-shadow:0 12px 30px rgba(0,0,0,.4)}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}}
.toast-body{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--text-2)}
.toast-body strong{font-weight:500;font-size:13.5px;color:var(--text)}
.toast-body .linklike{font-size:12px;margin-top:2px}
.palette-scrim{display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palette{width:min(580px,100%);background:#08101E;border:1px solid var(--line-3);border-radius:3px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:palIn .22s var(--ease);overflow:hidden}

.pal-input{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--text-3)}
.pal-input input{flex:1;height:52px;background:transparent;border:0;outline:none;font-size:15px;color:var(--text)}
.pal-list{list-style:none;margin:0;padding:6px;max-height:min(360px,50vh);overflow-y:auto}
.pal-list li{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:2px;color:var(--text-2);cursor:pointer;font-size:14px}
.pal-list li::before{content:">";font:12px var(--mono);color:var(--text-3)}
.pal-list li.on{background:rgba(95,208,228,.09);color:var(--text)}
.pal-list li.on::before{color:var(--cyan)}
.pal-list li.empty{cursor:default;height:auto;padding:14px 12px}
.pal-list li.empty::before{content:none}
.pal-label{flex:1}
.pal-group{font-size:11px;color:var(--text-3)}
.pal-foot{display:flex;gap:18px;padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--text-3)}
.pal-foot kbd{margin-right:4px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#08101E;border-top:1px solid var(--line-3);border-radius:10px 10px 0 0;padding:8px 12px calc(16px + env(safe-area-inset-bottom,0px));animation:sheetIn .3s var(--ease);z-index:41}
@keyframes sheetIn{from{transform:translateY(100%)}}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--line-3);margin:4px auto 10px}
.sheet ul{list-style:none;margin:0;padding:0}
.sheet a,.sheet button{display:flex;align-items:center;gap:14px;width:100%;height:50px;padding:0 10px;border:0;background:transparent;color:var(--text-2);text-decoration:none;font-size:15px;border-radius:3px;cursor:pointer;position:relative}
.sheet a.active{color:var(--cyan);background:rgba(95,208,228,.07)}
.sheet .badge{position:static;margin-left:auto}

/* boot */
.boot{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 45%,rgba(12,26,50,.75),rgba(3,6,12,.97) 70%);transition:opacity .7s ease,filter .7s ease}
.boot.out{opacity:0;filter:blur(6px);pointer-events:none}
.boot-inner{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.boot-mark{position:absolute;top:-70px;left:50%;width:300px;height:300px;transform:translateX(-50%);pointer-events:none;opacity:.5}
.boot-mark svg{width:100%;height:100%;fill:none;stroke:rgba(95,208,228,.35);stroke-width:.6;animation:spin 60s linear infinite}
.boot-mark circle{fill:var(--cyan);stroke:none}
.boot-word{font:200 clamp(44px,9vw,76px)/1 var(--sans);letter-spacing:.5em;padding-left:.5em;color:var(--text);animation:wordIn 1.2s var(--ease) both}
@keyframes wordIn{from{letter-spacing:.9em;opacity:0}}
.boot-sub{margin-top:14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3)}
.boot-state{margin:40px 0 16px;font-size:13px;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase}
.boot-lines{list-style:none;margin:0;padding:0;width:100%;font-size:13px}
.boot-lines li{display:flex;align-items:baseline;gap:10px;padding:4px 0;color:var(--text-3);transition:color .3s}
.boot-lines .leader{flex:1;border-bottom:1px dotted var(--line-3);transform:translateY(-4px)}
.boot-lines .st{width:70px;text-align:right;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px}
.boot-lines li.on{color:var(--text-2)}
.boot-lines li.on .st{color:var(--cyan)}
.boot-bar{display:grid;grid-template-columns:repeat(24,1fr) 48px;gap:3px;width:100%;margin-top:22px;height:10px;align-items:center}
.boot-bar i{height:10px;background:var(--line);border-radius:1px;transition:background .15s}
.boot-bar i.on{background:var(--cyan)}
.boot-bar .num{font-size:12px;color:var(--text-2);text-align:right}
.boot-foot{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:11px;color:var(--text-3);gap:12px}

/* responsive */
@media (max-width:1320px){
  .tb-mission .tb-name{display:none}
  .brand-sub{display:none}
  .cmdk{min-width:0}
}
@media (max-width:1180px){
  .shell{--sbw:64px}
  .shell .nav-label,.shell .sb-event{opacity:0;pointer-events:none}
  .shell .nav-flag{position:absolute;left:30px;top:10px}

  .console{height:min(600px,calc(100dvh - 300px))}

  .hide-md{display:none!important}
  .cmdk-text{display:none}
}
@media (max-width:760px){

  .mh-facts{width:100%;display:grid;grid-template-columns:1fr 1fr;row-gap:12px}

  .hide-sm{display:none!important}
  .g{gap:14px}

  .tstrip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -14px;padding:0 14px;scrollbar-width:none}

  .omap-tools .btn{width:34px;height:34px}
  .omap-legend{top:8px;bottom:auto}

  .crew-grid{grid-template-columns:minmax(0,1fr)}

}
